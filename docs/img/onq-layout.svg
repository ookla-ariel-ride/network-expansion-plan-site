</defs>

<!-- title block -->
<text x="40" y="34" class="t-title">On-Q 42" back panel</text>
<text x="40" y="50" class="t-sub">ENP4250-NA · inside view, door open · 12 px = 1 in · interior 14 × 41.75 × 4.31 in · body 14.3 × 42.75 × 4.09 in outside, door +1.2</text>
<line x1="40" y1="60" x2="720" y2="60" stroke="#1f2430" stroke-width="1"/>

