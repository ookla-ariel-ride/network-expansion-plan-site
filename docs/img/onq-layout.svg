  .t-in2 { font-size: 8px; fill: #6b7280; }
  .t-h { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9.5px; fill: #6b7280; letter-spacing: 0.08em; }
  .wall { fill: #ffffff; stroke: #1f2430; stroke-width: 2; }
  .flange { fill: #e9e9e4; stroke: #1f2430; stroke-width: 1; }
  .ko { fill: #f7f7f5; stroke: #1f2430; stroke-width: 1; }
  .ko-used { fill: #f7f7f5; stroke: #b5652b; stroke-width: 1.5; }
  .part { fill: #e6e8ec; stroke: #3b4252; stroke-width: 1; }
  .part-d { fill: #d3d7de; stroke: #3b4252; stroke-width: 1; }
  .ghost { fill: none; stroke: #9aa2b3; stroke-width: 1; stroke-dasharray: 4 3; }
  .tick { stroke: #9aa2b3; stroke-width: 0.8; }
  .tick5 { stroke: #1f2430; stroke-width: 1; }
  .cu { stroke: #b5652b; fill: none; }
  .fb { stroke: #1c86b0; fill: none; }
  .co { stroke: #1f2430; fill: none; }
  .callout circle { fill: #1f2430; stroke: #f7f7f5; stroke-width: 1.5; }
  .callout text { fill: #ffffff; font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; font-weight: 600; text-anchor: middle; }
  .lead { stroke: #6b7280; stroke-width: 0.7; }
  .dl { stroke: #6b7280; stroke-width: 0.7; }
  .depth-bar { fill: #d3d7de; stroke: #3b4252; stroke-width: 0.8; }
  .depth-plug { fill: #f7f7f5; stroke: #3b4252; stroke-width: 0.8; stroke-dasharray: 2 2; }
</style>
<defs>
