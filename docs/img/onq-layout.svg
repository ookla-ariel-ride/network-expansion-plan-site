<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 880" style="background:#f7f7f5" role="img" aria-label="Shop drawing of the On-Q 42 enclosure back panel, interior 14 by 41.75 inches, with eight numbered parts placed to scale, inch rulers on the top and left edges, the top and bottom knockouts, the drilled exit hole on the left wall, and a side-view depth section showing every part clears the 4.31 inch usable depth.">
<style>
