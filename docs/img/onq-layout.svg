<!-- ================= KEY ================= -->
<g transform="translate(320 124)">
  <text x="0" y="0" class="t-h">PART · POSITION (in, from top-left inside) · SIZE (in)</text>
  <text x="0" y="20" class="t-key"><tspan font-weight="600">1</tspan>  TII 212 coax surge arrestor · x 12.4  y 0.8 · 1.5 × 2.7, upright</text>
  <text x="14" y="34" class="t-sub">coax in from the top knockout · F jumper out to the modem's coax port (3)</text>
  <text x="14" y="46" class="t-sub">ground lug bonded to the house-circuit box (8), dashed green</text>
  <text x="0" y="64" class="t-key"><tspan font-weight="600">2</tspan>  Legrand AC106A6 × 3 · x 0.5  y 5.0 · 8.7 × 6.41</text>
  <text x="14" y="78" class="t-sub">A: 6 drops · B: 3 AP runs + 3 spares · C: 4th spare, 5 free</text>
  <text x="0" y="96" class="t-key"><tspan font-weight="600">3</tspan>  Ubee EU2251 modem, rotated, hung by its keyholes · x 4.6  y 13 · 6.7 × 8.46 × 2.8</text>
  <text x="14" y="110" class="t-sub">coax from 1 · WAN patch to the exit (4) · DC from the brick (6); ports face down</text>
  <text x="0" y="128" class="t-key"><tspan font-weight="600">4</tspan>  Drilled exit, left wall · y 24 · 2.5 in + F2242 ring</text>
  <text x="14" y="142" class="t-sub">8 patch + WAN + fiber → brush plate → rack</text>
  <text x="0" y="160" class="t-key"><tspan font-weight="600">5a</tspan>  OM4 fiber, pass-through · coil y 27–32 · 5 in dia</text>
  <text x="14" y="174" class="t-sub">attic → coil → exit hole → Switch X SFP+ 1; other end in the garage</text>
  <text x="0" y="192" class="t-key"><tspan font-weight="600">5b</tspan>  Slack of the 13 terminated runs · coil y 27–32</text>
  <text x="14" y="206" class="t-sub">every run is punched down now (18 positions); this is the</text>
  <text x="14" y="218" class="t-sub">excess length before the modules, clipped with AC103520</text>
  <text x="0" y="236" class="t-key"><tspan font-weight="600">6</tspan>  AC1031 strip · x 7.2  y 32.8 · 6.4 × 3.9 × 2.5 · modem brick x 1  y 24.7</text>
  <text x="0" y="256" class="t-key"><tspan font-weight="600">7</tspan>  Kit receptacle + USB in an F7526 box · x 0.5  y 37.5 · box 4.8 × 4.0 × 3.25</text>
  <text x="14" y="270" class="t-sub">left cutout · UPS-backed, switched · feeds the AC1031 strip</text>
  <text x="0" y="288" class="t-key"><tspan font-weight="600">8</tspan>  House-circuit GaN 65 W USB-C duplex in an F7526 box · x 8.7  y 37.5 · same box</text>
  <text x="14" y="302" class="t-sub">always on, not UPS-backed</text>
  <text x="0" y="320" class="t-key"><tspan font-weight="600">9</tspan>  On-Q VM1002 1×8 passive splitter · x 0.5  y 13 · 3.6 × 6.42 × 1.85</text>
  <text x="14" y="334" class="t-sub">the five room coax runs park here, off the modem path (internet only, no TV)</text>
  <text x="0" y="362" class="t-h">KNOCKOUTS</text>
  <text x="0" y="382" class="t-key">Top: 5 × 2 in knockouts (all 5 used, AC1034 grommets) · Bottom: 2 F7526 boxes</text>
  <text x="0" y="396" class="t-key">Sides: none</text>
  <text x="0" y="410" class="t-sub">Copper-outlined knockouts are the ones in use.</text>
  <text x="0" y="438" class="t-h">WIDTH CHECK · 14 in inside</text>
  <text x="0" y="458" class="t-key">Three modules = 8.7 in. Below them: VM1002 3.6 + 0.5 gap + modem 6.7 = 10.8 in.</text>
  <text x="0" y="472" class="t-key">No plate under the modem: the AC1040F (15.8 × 12) would cover the splitter.</text>
  <text x="0" y="502" class="t-h">STILL TO MEASURE</text>
  <text x="0" y="522" class="t-key">Slack on the six existing drops (3–4 ft to reach the modules)</text>
</g>

<!-- ================= DEPTH SECTION ================= -->
<g transform="translate(90 730)">
  <text x="0" y="-10" class="t-h">DEPTH CHECK · side view · 12 px = 1 in</text>
  <!-- baseline (back panel) and limits -->
  <line x1="0" y1="0" x2="0" y2="112" stroke="#1f2430" stroke-width="2"/>
