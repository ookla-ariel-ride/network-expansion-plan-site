<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="background:#f7f7f5" viewBox="0 0 1170 350" role="img" aria-label="Signal path: modem to Gold Pro to Switch X in the closet; Switch X copper to six wall drops and two AP7Cs; three OM4 fiber pairs to the garage cabinet. Pair B feeds Switch SE 1 with the eight camera runs and the UNVR Pro; pair C feeds Switch SE 2 with the UNAS-Pro, the Plex host, a Pi-hole and pfSense. Pair A feeds the lab fabric: the owned QNAP QSW-M408-4C with three Xeon hosts and a GiGaPlus copper switch; a second copper switch is an isolated storage network between the NAS and the Xeons.">
<style>
  svg { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .lbl { font-size: 12px; fill: #1f2430; }
  .lbl-2 { font-size: 11px; fill: #6b7280; }
  .edge { stroke: #1f2430; stroke-width: 1.5; fill: none; }
  .edge-c { stroke: #b5652b; stroke-width: 2.5; fill: none; }
  .edge-f { stroke: #1c86b0; stroke-width: 2.5; fill: none; }
  .node { fill: #e6e8ec; stroke: #1f2430; stroke-width: 1.2; }
  .lane { font-family: ui-monospace, Menlo, monospace; font-size: 10px; fill: #6b7280; letter-spacing: 0.08em; }
</style>
<defs>
  <marker id="a2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1f2430"/></marker>
</defs>
<text x="0" y="16" class="lane">CLOSET</text>
<text x="560" y="16" class="lane">GARAGE CABINET · PRODUCTION FABRIC</text>
<text x="560" y="236" class="lane">GARAGE CABINET · LAB FABRIC</text>
<line x1="520" y1="4" x2="520" y2="336" stroke="#1f2430" stroke-width="1" stroke-dasharray="6 5"/>
<line x1="540" y1="222" x2="1160" y2="222" stroke="#9aa2b3" stroke-width="1" stroke-dasharray="3 3"/>

<!-- closet -->
<rect x="0" y="120" width="96" height="40" class="node"/><text x="48" y="144" class="lbl" text-anchor="middle">Modem</text>
<rect x="150" y="120" width="96" height="40" class="node"/><text x="198" y="144" class="lbl" text-anchor="middle">Gold Pro</text>
<rect x="300" y="120" width="110" height="40" class="node"/><text x="355" y="144" class="lbl" text-anchor="middle">Switch X</text>
<line x1="96" y1="140" x2="150" y2="140" class="edge" marker-end="url(#a2)"/>
<text x="123" y="132" class="lbl-2" text-anchor="middle">WAN</text>
<line x1="246" y1="140" x2="300" y2="140" class="edge" marker-end="url(#a2)" marker-start="url(#a2)"/>
<text x="273" y="128" class="lbl-2" text-anchor="middle">10G trunk</text>
<path d="M355,160 L355,220" class="edge-c" marker-end="url(#a2)"/>
<text x="355" y="242" class="lbl" text-anchor="middle">6 wall drops + 2 AP7C</text>
<text x="355" y="258" class="lbl-2" text-anchor="middle">8 copper ports · PoE+ on the APs</text>
<path d="M355,120 L355,47 L240,47" class="edge" marker-end="url(#a2)"/>
<text x="308" y="40" class="lbl-2" text-anchor="middle">SFP+ 2 · Mgmt breakout</text>
<rect x="120" y="30" width="120" height="34" class="node"/><text x="180" y="45" class="lbl" text-anchor="middle">XMG-105HP</text><text x="180" y="58" class="lbl-2" text-anchor="middle">Pi #1, Domotz, PDU</text>

<!-- fiber pairs -->
<path d="M410,132 L470,132 L470,72 L640,72" class="edge-f" marker-end="url(#a2)"/>
<text x="575" y="62" class="lbl-2" text-anchor="middle">OM4 pair B · SFP+ 3</text>
<path d="M410,140 L480,140 L480,150 L640,150" class="edge-f" marker-end="url(#a2)"/>
<text x="575" y="176" class="lbl-2" text-anchor="middle">OM4 pair C · SFP+ 4</text>
<path d="M410,148 L470,148 L470,280 L640,280" class="edge-f" marker-end="url(#a2)"/>
<text x="575" y="270" class="lbl-2" text-anchor="middle">OM4 pair A · SFP+ 1</text>

<!-- production fabric -->
<rect x="640" y="52" width="110" height="40" class="node"/><text x="695" y="70" class="lbl" text-anchor="middle">Switch SE #1</text><text x="695" y="84" class="lbl-2" text-anchor="middle">cameras</text>
<rect x="640" y="130" width="110" height="40" class="node"/><text x="695" y="148" class="lbl" text-anchor="middle">Switch SE #2</text><text x="695" y="162" class="lbl-2" text-anchor="middle">production hosts</text>
<rect x="800" y="30" width="96" height="34" class="node"/><text x="848" y="51" class="lbl" text-anchor="middle">UNVR Pro</text>
