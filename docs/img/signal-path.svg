<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="background:#f7f7f5" viewBox="0 0 1060 250" role="img" aria-label="Signal path: modem to Gold Pro to Switch X in the closet; Switch X copper to six wall drops and two AP7Cs; OM4 fiber from Switch X to the lab top-of-rack switch in the garage; the ToR feeds the UNVR Pro, the Switch SE, the UNAS-Pro and the lab hosts; eight camera runs land on the SE.">
<style>
  svg { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .dim { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #6b7280; }
  .lbl { font-size: 12px; fill: #1f2430; }
  .lbl-2 { font-size: 11px; fill: #6b7280; }
  .shell { fill: #ffffff; stroke: #1f2430; stroke-width: 2; }
  .rail { stroke: #1f2430; stroke-width: 1.5; }
  .unit { fill: #e6e8ec; stroke: #3b4252; stroke-width: 1; }
  .unit-2 { fill: #d3d7de; stroke: #3b4252; stroke-width: 1; }
  .ghost { fill: none; stroke: #9aa2b3; stroke-width: 1; stroke-dasharray: 4 3; }
  .callout circle { fill: #1f2430; stroke: #f7f7f5; stroke-width: 1.5; }
  .callout text { fill: #ffffff; font-family: ui-monospace, Menlo, monospace; font-size: 10px; font-weight: 600; text-anchor: middle; }
  .loop { fill: none; stroke: #b5652b; stroke-width: 2; }
  .loop-f { fill: none; stroke: #1c86b0; stroke-width: 1.6; }
  .edge { stroke: #1f2430; stroke-width: 1.5; fill: none; }
  .edge-c { stroke: #b5652b; stroke-width: 2.5; fill: none; }
  .edge-f { stroke: #1c86b0; stroke-width: 2.5; fill: none; }
  .node { fill: #e6e8ec; stroke: #1f2430; stroke-width: 1.2; }
  .lane { font-family: ui-monospace, Menlo, monospace; font-size: 10px; fill: #6b7280; letter-spacing: 0.08em; }
</style>

    <defs>
      <marker id="a2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1f2430"/></marker>
    </defs>
    <text x="0" y="16" class="lane">CLOSET</text>
    <text x="560" y="16" class="lane">GARAGE</text>
    <line x1="520" y1="4" x2="520" y2="246" stroke="#1f2430" stroke-width="1" stroke-dasharray="6 5"/>

    <!-- nodes closet -->
    <rect x="0" y="92" width="96" height="40" class="node"/><text x="48" y="116" class="lbl" text-anchor="middle">Modem</text>
    <rect x="150" y="92" width="96" height="40" class="node"/><text x="198" y="116" class="lbl" text-anchor="middle">Gold Pro</text>
    <rect x="300" y="92" width="110" height="40" class="node"/><text x="355" y="116" class="lbl" text-anchor="middle">Switch X</text>
    <!-- edges closet -->
    <line x1="96" y1="112" x2="150" y2="112" class="edge" marker-end="url(#a2)"/>
    <text x="123" y="104" class="lbl-2" text-anchor="middle">WAN</text>
    <line x1="246" y1="112" x2="300" y2="112" class="edge" marker-end="url(#a2)" marker-start="url(#a2)"/>
    <text x="273" y="100" class="lbl-2" text-anchor="middle">10G trunk</text>
    <!-- copper fan-out -->
    <path d="M355,132 L355,190" class="edge-c" marker-end="url(#a2)"/>
    <text x="355" y="212" class="lbl" text-anchor="middle">6 wall drops + 2 AP7C</text>
    <text x="355" y="228" class="lbl-2" text-anchor="middle">8 copper ports · PoE++ on the APs</text>
    <!-- fiber -->
    <path d="M410,112 L640,112" class="edge-f" marker-end="url(#a2)"/>
    <text x="525" y="102" class="lbl-2" text-anchor="middle">OM4 fiber · 10GBASE-SR · SFP+ 1</text>
    <!-- nodes garage -->
    <rect x="640" y="92" width="110" height="40" class="node"/><text x="695" y="116" class="lbl" text-anchor="middle">Lab ToR</text>
    <rect x="800" y="14" width="96" height="34" class="node"/><text x="848" y="35" class="lbl" text-anchor="middle">UNVR Pro</text>
    <rect x="800" y="62" width="96" height="34" class="node"/><text x="848" y="83" class="lbl" text-anchor="middle">Switch SE</text>
    <rect x="800" y="110" width="96" height="34" class="node"/><text x="848" y="131" class="lbl" text-anchor="middle">UNAS-Pro</text>
    <rect x="800" y="158" width="96" height="34" class="node"/><text x="848" y="179" class="lbl" text-anchor="middle">Lab hosts</text>
    <!-- edges garage -->
    <path d="M750,100 L775,100 L775,31 L800,31" class="edge" marker-end="url(#a2)"/>
    <path d="M750,108 L780,108 L780,79 L800,79" class="edge" marker-end="url(#a2)"/>
    <path d="M750,116 L780,116 L780,127 L800,127" class="edge" marker-end="url(#a2)"/>
    <path d="M750,124 L775,124 L775,175 L800,175" class="edge" marker-end="url(#a2)"/>
    <text x="776" y="198" class="lbl-2" text-anchor="middle" font-size="10">SFP+ DACs</text>
    <text x="848" y="212" class="lbl-2" text-anchor="middle">2nd stacked mini rack: UNAS-Pro, lab hosts</text>
    <!-- cameras -->
    <path d="M896,79 L940,79" class="edge-c" marker-end="url(#a2)"/>
    <text x="946" y="74" class="lbl">8 camera</text>
    <text x="946" y="88" class="lbl">runs</text>
    <text x="946" y="101" class="lbl-2">5 live · VLAN 40</text>
  </svg>
