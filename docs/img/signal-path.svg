<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="background:#f7f7f5" viewBox="-16 0 1210 615" role="img" aria-label="Signal path: the modem, Gold Pro and Switch X in the closet, with a DAC to the Zyxel XMG-105HP management breakout and copper to six wall drops and two AP7 ceiling units. Three OM4 fiber pairs cross to the garage cabinet. Pair B feeds Switch SE 1 with the eight camera runs and the UNVR Pro. Pair C feeds Switch SE 2 with the UGREEN DXP8800 Plus production NAS at 10G, the Plex host, the DXP4800 Plus and UNAS-Pro, pfSense, and the TRENDnet TPE-1020WS console switch carrying Pi-hole 2, the three IPMI ports and the PDUs. Pair A feeds the lab fabric: the QNAP QSW-M408-4C top-of-rack switch with the Supermicro SC216 and 6028U-TR4 plus, the Chenbro NR12001, a GiGaPlus copper switch, the two QNAP lab NAS units and the Gold gen-1. A second GiGaPlus switch is an isolated storage network between the NAS units and the servers.">
<style>
  svg { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .lbl { font-size: 12px; fill: #1f2430; }
  .lbl-2 { font-size: 11px; fill: #6b7280; }
  .edge { stroke: #1f2430; stroke-width: 1.5; fill: none; }
  .edge-c { stroke: #b5652b; stroke-width: 2.5; fill: none; }
  .edge-f { stroke: #1c86b0; stroke-width: 2.5; fill: none; }
  .edge-s { stroke: #2f855a; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
  .node { fill: #e6e8ec; stroke: #1f2430; stroke-width: 1.2; }
  .node-s { fill: #ffffff; stroke: #2f855a; stroke-width: 1.2; stroke-dasharray: 4 3; }
  .lane { font-family: ui-monospace, Menlo, monospace; font-size: 10px; fill: #6b7280; letter-spacing: 0.08em; }
</style>
<defs>
  <marker id="a2" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#1f2430"/></marker>
</defs>

<text x="0" y="20" class="lane">CLOSET</text>
<text x="600" y="20" class="lane">GARAGE CABINET &#183; PRODUCTION FABRIC</text>
<text x="600" y="392" class="lane">GARAGE CABINET &#183; LAB FABRIC</text>
<line x1="560" y1="8" x2="560" y2="580" stroke="#1f2430" stroke-width="1" stroke-dasharray="6 5"/>
