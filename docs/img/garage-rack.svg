    <circle cx="-40" cy="133" r="8"/><text x="-40" y="136.5">4</text>
    <circle cx="-40" cy="196" r="8"/><text x="-40" y="199.5">5</text>
    <circle cx="-40" cy="238" r="8"/><text x="-40" y="241.5">6</text>
