<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 800" style="background:#f7f7f5" role="img" aria-label="Shop drawing of the garage cabinet: a UniFi 42U 1,000 mm rack holding two fabrics. Production at the top: Switch SE 1 and Switch SE 2 on their own shelves, the UNVR Pro, the UNAS-Pro, the UGREEN DXP8800 Plus and DXP4800 Plus side by side on a 5U shelf, the Plex host, a Raspberry Pi and the pfSense box, a DLI 222 PDU, a basic strip and the TRENDnet TPE-1020WS console switch. Lab below: the QNAP QSW-M408-4C top-of-rack switch, two GiGaPlus 10GBASE-T switches, the Supermicro SC216 and 6028U-TR4 plus servers, the Chenbro NR12001, a Tripp Lite rack LCD console, two QNAP lab NAS units, the Gold gen-1, a second DLI 222 and a strip. A rack UPS at the base. Three fiber pairs from the closet and the eight camera runs from the attic enter at the top.">
<style>
