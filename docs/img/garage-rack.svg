  <rect x="21" y="295" width="147" height="13" class="part-d" rx="1"/>
  <text x="94" y="304" class="t-in2" text-anchor="middle">GP-2100 #1 · lab 10GBASE-T</text>
  <rect x="21" y="309" width="147" height="13" class="part-d" rx="1"/>
  <text x="94" y="318" class="t-in2" text-anchor="middle">GP-2100 #2 · storage net</text>
  <rect x="21" y="323" width="147" height="27" class="ghost" rx="1"/><text x="94" y="339" class="t-in2" text-anchor="middle">Xeon host 1 · specs pending</text>
  <rect x="21" y="351" width="147" height="27" class="ghost" rx="1"/><text x="94" y="367" class="t-in2" text-anchor="middle">Xeon host 2</text>
  <rect x="21" y="379" width="147" height="27" class="ghost" rx="1"/><text x="94" y="395" class="t-in2" text-anchor="middle">Xeon host 3</text>
  <!-- U14-11 lab NAS shelf -->
  <rect x="21" y="407" width="147" height="55" class="part"/>
  <rect x="26" y="411" width="62" height="47" class="part-d" rx="2"/><text x="57" y="432" class="t-in2" text-anchor="middle">TS-932PX</text><text x="57" y="443" class="t-in2" text-anchor="middle">lab NAS</text>
  <rect x="98" y="411" width="62" height="47" class="part-d" rx="2"/><text x="129" y="432" class="t-in2" text-anchor="middle">TS-563</text><text x="129" y="443" class="t-in2" text-anchor="middle">scratch / spare</text>
  <!-- U10 Gold gen-1, U9 lab PDU -->
  <rect x="21" y="463" width="147" height="13" class="part"/>
  <rect x="24" y="465" width="52" height="9" class="part-d" rx="1"/><text x="50" y="472" class="t-in2" text-anchor="middle">Gold gen-1</text>
  <rect x="21" y="477" width="147" height="13" class="part-d" rx="1"/>
  <g fill="#ffffff" stroke="#3b4252" stroke-width="0.5"><rect x="26" y="480" width="6" height="7"/><rect x="35" y="480" width="6" height="7"/><rect x="44" y="480" width="6" height="7"/><rect x="53" y="480" width="6" height="7"/><rect x="62" y="480" width="6" height="7"/><rect x="71" y="480" width="6" height="7"/><rect x="80" y="480" width="6" height="7"/><rect x="89" y="480" width="6" height="7"/></g>
  <text x="140" y="487" class="t-in2" text-anchor="middle">second PDU · lab</text>
  <rect x="21" y="491" width="147" height="55" class="ghost" rx="1"/>
