<g transform="translate(400 112)">
  <text x="0" y="0" class="t-h">PART &#183; SIZE (in) &#183; NOTES</text>
  <text x="0" y="24" class="t-key"><tspan font-weight="600">1</tspan>  Switch SE #1 and #2, one per 1U shelf &#183; U41, U40</text>
  <text x="14" y="38" class="t-sub">9.45 &#215; 4.13 &#215; 1.06 each; two side by side are 18.9 in, wider than the</text>
  <text x="14" y="50" class="t-sub">17.7 in rail opening. SE #1 cameras and UNVR, pair B. SE #2 hosts, pair C</text>
  <text x="0" y="74" class="t-key"><tspan font-weight="600">2</tspan>  UNVR Pro &#183; U39 to U38 &#183; 2U, 17.4 &#215; 12.8 &#215; 3.4, 7 bays, 10G to SE #1</text>
  <text x="0" y="96" class="t-key"><tspan font-weight="600">3</tspan>  UNAS-Pro &#183; U37 to U36 &#183; same chassis; Protect archive, 1 GbE to SE #2</text>
  <text x="0" y="120" class="t-key"><tspan font-weight="600">4</tspan>  UGREEN DXP8800 Plus and DXP4800 Plus, one 5U shelf &#183; U35 to U31</text>
  <text x="14" y="134" class="t-sub">8800: 14.4 &#215; 10.2 &#215; 7.4, 8-bay, i5, 2 &#215; 10GbE (one to SE #2 by module,</text>
  <text x="14" y="146" class="t-sub">one to the storage net). 4800: 10.1 &#215; 7.0 &#215; 7.0, backup target, 2.5G to</text>
  <text x="14" y="158" class="t-sub">SE #2 and 10G to the storage net. 17.2 in side by side</text>
  <text x="0" y="182" class="t-key"><tspan font-weight="600">5</tspan>  Plex host, Pi #2, pfSense &#183; U30 to U29</text>
  <text x="14" y="196" class="t-sub">Plex host pending. Pi #2: Pi-hole and NUT for the rack UPS, PoE from the TPE</text>
  <text x="0" y="220" class="t-key"><tspan font-weight="600">6</tspan>  DLI 222 and a basic strip, production &#183; U28 to U27</text>
  <text x="14" y="234" class="t-sub">222: UNVR, UNAS, both UGREENs, Plex, pfSense, two spare. The strip takes</text>
  <text x="14" y="246" class="t-sub">the switch bricks, which never need remote cycling</text>
  <text x="0" y="270" class="t-key"><tspan font-weight="600">7</tspan>  TRENDnet TPE-1020WS &#183; U26 &#183; 8 &#215; GbE PoE+, 75 W, Mgmt only, off SE #2</text>
  <text x="14" y="284" class="t-sub">Pi #2, three IPMI ports, both 222s, the OOB Cat6 (unpatched at Switch X</text>
  <text x="14" y="296" class="t-sub">while pair C is lit, or it closes an L2 loop on Mgmt)</text>
  <text x="0" y="320" class="t-key"><tspan font-weight="600">8</tspan>  Lab switches &#183; U23 to U21, all owned</text>
  <text x="14" y="334" class="t-sub">QNAP QSW-M408-4C ToR on pair A (4 &#215; 10G combo, 8 &#215; GbE); GP-2100 #1 for</text>
  <text x="14" y="346" class="t-sub">copper-NIC hosts; GP-2100 #2 as the isolated storage network</text>
  <text x="0" y="370" class="t-key"><tspan font-weight="600">9</tspan>  Three lab servers &#183; U20 to U16, and the Tripp Lite LCD console &#183; U15</text>
  <text x="14" y="384" class="t-sub">SC216 24.8 in deep, 6028U-TR4+ 28.46 in, Chenbro 1U. The rails adjust</text>
  <text x="14" y="396" class="t-sub">25.7 to 34.5 in, so both Supermicros fit. The console needs 27 in of rail depth</text>
  <text x="0" y="420" class="t-key"><tspan font-weight="600">10</tspan>  QNAP TS-932PX and TS-563 &#183; U14 to U11, on a shelf</text>
  <text x="14" y="434" class="t-sub">TS-932PX on the ToR at 10G, VLAN 99; TS-563 on GP-2100 #1. Both hold Plex</text>
  <text x="14" y="446" class="t-sub">data until the library consolidates on the 8800</text>
  <text x="0" y="470" class="t-key"><tspan font-weight="600">11</tspan>  Gold gen-1, the lab DLI 222 and a strip &#183; U10 to U8</text>
  <text x="14" y="484" class="t-sub">Gold gen-1 on the ToR's GbE ports as the nested lab firewall. The lab 222</text>
  <text x="14" y="496" class="t-sub">takes both Supermicros' four supplies, the Chenbro, both QNAPs, the Gold</text>
  <text x="0" y="520" class="t-key"><tspan font-weight="600">12</tspan>  Rack UPS &#183; U4 to U1 &#183; 2U to 4U, sized once the draw is measured</text>

  <text x="0" y="556" class="t-h">TWO FABRICS, ONE CABINET &#183; PLUS A STORAGE NETWORK &#183; 37 OF 42 U USED</text>
  <text x="0" y="576" class="t-key">Each garage switch has its own fiber pair to Switch X; production (top) and lab</text>
  <text x="0" y="590" class="t-key">(bottom) each have their own switched PDU. The cameras, the NAS units and the Pi</text>
  <text x="0" y="604" class="t-key">never touch a lab switch. The storage network is a non-routed 10G segment between</text>
  <text x="0" y="618" class="t-key">second NICs in the NAS units and the servers; NFS and iSCSI only, no gateway.</text>

  <text x="0" y="654" class="t-h">DEPTH &#183; 34.5 in max rail depth &#183; 8 px = 1 in</text>
  <g transform="translate(0 664)">
    <line x1="0" y1="0" x2="0" y2="76" stroke="#1f2430" stroke-width="1.5"/>
    <line x1="276" y1="-4" x2="276" y2="80" stroke="#6b7280" stroke-width="0.7" stroke-dasharray="3 2"/>
    <rect x="0" y="4" width="227.7" height="12" class="depth-bar"/><text x="284" y="14" class="t-in">6028U-TR4+ 28.46</text>
    <rect x="0" y="22" width="198.4" height="12" class="depth-bar"/><text x="284" y="32" class="t-in">SC216 24.8</text>
    <rect x="0" y="40" width="115.2" height="12" class="depth-bar"/><text x="284" y="50" class="t-in">DXP8800 Plus 14.4</text>
    <rect x="0" y="58" width="102.4" height="12" class="depth-bar"/><text x="284" y="68" class="t-in">UNVR / UNAS-Pro 12.8</text>
    <text x="276" y="92" class="t-dim" text-anchor="middle">34.5</text>
  </g>
</g>
</svg>
