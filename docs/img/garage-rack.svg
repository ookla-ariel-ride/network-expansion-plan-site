<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 830" style="background:#f7f7f5" role="img" aria-label="Shop drawing of the garage cabinet: a UniFi 42U 1,000 mm rack holding two fabrics. Production at the top: both Switch SEs on one shelf, the UNVR Pro, the UNAS-Pro, the Plex host, a Raspberry Pi and the pfSense box, and a DLI 222 PDU. Lab below: the owned QNAP and GiGaPlus lab switches, a storage switch, three Xeon servers, the Gold gen-1 and a second PDU. A rack UPS at the base. Three fiber pairs from the closet and the eight camera runs from the attic enter at the top.">
<style>
  svg { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t-title { font-size: 15px; font-weight: 600; fill: #1f2430; }
  .t-sub { font-size: 10.5px; fill: #6b7280; }
  .t-key { font-size: 11px; fill: #1f2430; }
  .t-dim { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9.5px; fill: #6b7280; }
  .t-h { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 9.5px; fill: #6b7280; letter-spacing: 0.08em; }
  .t-in { font-size: 9px; fill: #1f2430; }
  .t-in2 { font-size: 8px; fill: #6b7280; }
  .frame { fill: #ffffff; stroke: #1f2430; stroke-width: 2; }
  .post { fill: #d3d7de; stroke: #1f2430; stroke-width: 1; }
  .part { fill: #e6e8ec; stroke: #3b4252; stroke-width: 1; }
  .part-d { fill: #d3d7de; stroke: #3b4252; stroke-width: 1; }
  .ghost { fill: none; stroke: #9aa2b3; stroke-width: 1; stroke-dasharray: 4 3; }
  .tick { stroke: #9aa2b3; stroke-width: 0.8; }
  .cu { stroke: #b5652b; fill: none; }
  .fb { stroke: #1c86b0; fill: none; }
  .callout circle { fill: #1f2430; stroke: #f7f7f5; stroke-width: 1.5; }
  .callout text { fill: #ffffff; font-family: ui-monospace, Menlo, monospace; font-size: 9.5px; font-weight: 600; text-anchor: middle; }
  .lead { stroke: #6b7280; stroke-width: 0.7; }
  .dl { stroke: #6b7280; stroke-width: 0.7; }
  .depth-bar { fill: #d3d7de; stroke: #3b4252; stroke-width: 0.8; }
  .fan { fill: none; stroke: #6b7280; stroke-width: 0.8; }
</style>
<defs>
  <marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/></marker>
</defs>

<text x="40" y="30" class="t-title">Garage cabinet · UniFi 42U Rack, 1,000 mm</text>
<text x="40" y="46" class="t-sub">UACC-Rack-42U-1000 · 23.6 in wide, 39.4 in deep, 80.7 in tall on casters · 204 lb empty, 1,764 lb static · four 120 mm fans in the roof · 8 px = 1 in</text>
<line x1="40" y1="56" x2="900" y2="56" stroke="#1f2430" stroke-width="1"/>

<!-- ============ FRONT VIEW ============ 8 px/in. Body 23.6 x 77.4 in = 189 x 619; rails 19 in apart = 152; 1U = 14 px; 42U = 588 px from y=14 -->
<g transform="translate(90 118)">
  <text x="0" y="-44" class="t-h">FRONT · door open</text>

  <!-- fiber and camera runs entering the roof opening -->
  <path d="M-30,-10 L58,-10 L58,10" class="fb" stroke-width="1.6"/>
  <path d="M-30,-6 L62,-6 L62,10" class="fb" stroke-width="1.6"/>
  <path d="M-30,-2 L66,-2 L66,10" class="fb" stroke-width="1.6"/>
  <text x="0" y="-16" class="t-in2">OM4 pairs A, B, C from Switch X</text>
  <path d="M230,-36 L120,-36 L120,10" class="cu" stroke-width="3"/>
  <text x="234" y="-33" class="t-in2">8 camera runs, one bundle from the attic</text>

  <!-- cabinet body -->
  <rect x="0" y="0" width="189" height="619" class="frame"/>
  <!-- roof fans -->
  <g class="fan"><circle cx="40" cy="7" r="5"/><circle cx="76" cy="7" r="5"/><circle cx="112" cy="7" r="5"/><circle cx="148" cy="7" r="5"/></g>
  <!-- casters -->
  <circle cx="24" cy="632" r="10" fill="#ffffff" stroke="#1f2430" stroke-width="1.5"/>
  <circle cx="165" cy="632" r="10" fill="#ffffff" stroke="#1f2430" stroke-width="1.5"/>
  <!-- posts -->
  <rect x="15" y="14" width="6" height="588" class="post"/>
  <rect x="168" y="14" width="6" height="588" class="post"/>
  <!-- U ticks -->
  <g class="tick">
    <line x1="-6" y1="14" x2="0" y2="14"/><line x1="-6" y1="98" x2="0" y2="98"/><line x1="-6" y1="182" x2="0" y2="182"/><line x1="-6" y1="266" x2="0" y2="266"/><line x1="-6" y1="350" x2="0" y2="350"/><line x1="-6" y1="434" x2="0" y2="434"/><line x1="-6" y1="518" x2="0" y2="518"/><line x1="-6" y1="602" x2="0" y2="602"/>
  </g>
  <g class="t-dim" text-anchor="end">
    <text x="-10" y="24">U42</text><text x="-10" y="108">U36</text><text x="-10" y="192">U30</text><text x="-10" y="276">U24</text><text x="-10" y="360">U18</text><text x="-10" y="444">U12</text><text x="-10" y="528">U6</text><text x="-10" y="605">U1</text>
  </g>

  <!-- PRODUCTION BLOCK, U42 to U31 -->
  <rect x="21" y="16" width="147" height="10" class="part-d"/>
  <text x="94" y="24" class="t-in2" text-anchor="middle">U42 · brush panel, fiber and camera entry</text>
  <rect x="21" y="28" width="147" height="14" class="part"/>
  <rect x="22" y="31" width="72" height="9" class="part-d" rx="1"/><text x="58" y="38" class="t-in2" text-anchor="middle">SE #1 cameras</text>
  <rect x="96" y="31" width="72" height="9" class="part-d" rx="1"/><text x="132" y="38" class="t-in2" text-anchor="middle">SE #2 hosts</text>
  <rect x="25" y="43" width="139" height="27" class="part-d" rx="2"/>
  <text x="94" y="54" class="t-in" text-anchor="middle">UNVR Pro</text>
  <g fill="#ffffff" stroke="#3b4252" stroke-width="0.5"><rect x="31" y="59" width="16" height="6"/><rect x="49" y="59" width="16" height="6"/><rect x="67" y="59" width="16" height="6"/><rect x="85" y="59" width="16" height="6"/><rect x="103" y="59" width="16" height="6"/><rect x="121" y="59" width="16" height="6"/><rect x="139" y="59" width="16" height="6"/></g>
  <rect x="25" y="71" width="139" height="27" class="part-d" rx="2"/>
  <text x="94" y="82" class="t-in" text-anchor="middle">UNAS-Pro</text>
  <g fill="#ffffff" stroke="#3b4252" stroke-width="0.5"><rect x="31" y="87" width="16" height="6"/><rect x="49" y="87" width="16" height="6"/><rect x="67" y="87" width="16" height="6"/><rect x="85" y="87" width="16" height="6"/><rect x="103" y="87" width="16" height="6"/><rect x="121" y="87" width="16" height="6"/><rect x="139" y="87" width="16" height="6"/></g>
  <rect x="21" y="99" width="147" height="13" class="ghost" rx="1"/>
  <text x="94" y="108" class="t-in2" text-anchor="middle">Plex host · form factor pending</text>
  <rect x="21" y="113" width="147" height="13" class="part"/>
  <rect x="24" y="115" width="30" height="9" class="part-d" rx="1"/><text x="39" y="122" class="t-in2" text-anchor="middle">Pi #2</text>
  <rect x="60" y="115" width="60" height="9" class="part-d" rx="1"/><text x="90" y="122" class="t-in2" text-anchor="middle">pfSense</text>
  <rect x="21" y="127" width="147" height="13" class="part-d" rx="1"/>
  <g fill="#ffffff" stroke="#3b4252" stroke-width="0.5"><rect x="26" y="130" width="6" height="7"/><rect x="35" y="130" width="6" height="7"/><rect x="44" y="130" width="6" height="7"/><rect x="53" y="130" width="6" height="7"/><rect x="62" y="130" width="6" height="7"/><rect x="71" y="130" width="6" height="7"/><rect x="80" y="130" width="6" height="7"/><rect x="89" y="130" width="6" height="7"/></g>
  <text x="140" y="137" class="t-in2" text-anchor="middle">DLI 222 · production</text>
  <rect x="21" y="141" width="147" height="13" class="part-d" rx="1"/>
  <text x="94" y="150" class="t-in2" text-anchor="middle">TPE-1020WS · console switch</text>
  <rect x="21" y="155" width="147" height="27" class="ghost" rx="1"/>
  <text x="94" y="171" class="t-in2" text-anchor="middle">production growth · small servers</text>

  <!-- fabric divider -->
  <line x1="21" y1="182" x2="168" y2="182" stroke="#1f2430" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="172" y="178" class="t-h" font-size="8">PRODUCTION</text>
  <text x="172" y="192" class="t-h" font-size="8">LAB</text>

  <!-- LAB BLOCK, U30 down -->
  <rect x="21" y="183" width="147" height="13" class="part-d" rx="1"/>
  <text x="94" y="192" class="t-in2" text-anchor="middle">QSW-M408-4C · lab ToR</text>
  <rect x="21" y="197" width="147" height="13" class="part-d" rx="1"/>
  <text x="94" y="206" class="t-in2" text-anchor="middle">GP-S100 #1 · lab 10GBASE-T</text>
  <rect x="21" y="211" width="147" height="13" class="part-d" rx="1"/>
  <text x="94" y="220" class="t-in2" text-anchor="middle">GP-S100 #2 · storage net</text>
  <rect x="21" y="225" width="147" height="27" class="ghost" rx="1"/><text x="94" y="241" class="t-in2" text-anchor="middle">Xeon host 1 · specs pending</text>
  <rect x="21" y="253" width="147" height="27" class="ghost" rx="1"/><text x="94" y="269" class="t-in2" text-anchor="middle">Xeon host 2</text>
  <rect x="21" y="281" width="147" height="27" class="ghost" rx="1"/><text x="94" y="297" class="t-in2" text-anchor="middle">Xeon host 3</text>
  <rect x="21" y="309" width="147" height="13" class="part"/>
  <rect x="24" y="311" width="52" height="9" class="part-d" rx="1"/><text x="50" y="318" class="t-in2" text-anchor="middle">Gold gen-1</text>
  <rect x="21" y="323" width="147" height="13" class="part-d" rx="1"/>
  <g fill="#ffffff" stroke="#3b4252" stroke-width="0.5"><rect x="26" y="326" width="6" height="7"/><rect x="35" y="326" width="6" height="7"/><rect x="44" y="326" width="6" height="7"/><rect x="53" y="326" width="6" height="7"/><rect x="62" y="326" width="6" height="7"/><rect x="71" y="326" width="6" height="7"/><rect x="80" y="326" width="6" height="7"/><rect x="89" y="326" width="6" height="7"/></g>
  <text x="140" y="333" class="t-in2" text-anchor="middle">second PDU · lab</text>
  <rect x="21" y="337" width="147" height="209" class="ghost" rx="1"/>
  <text x="94" y="444" class="t-in2" text-anchor="middle">U19 to U5 free · lab growth</text>
  <rect x="21" y="547" width="147" height="55" class="ghost" rx="1"/>
  <text x="94" y="571" class="t-in2" text-anchor="middle">rack UPS · 2U to 4U</text>
  <text x="94" y="582" class="t-in2" text-anchor="middle">sized after the server specs</text>

  <!-- callouts -->
  <g class="callout">
    <circle cx="-40" cy="35" r="8"/><text x="-40" y="38.5">1</text>
    <circle cx="-40" cy="57" r="8"/><text x="-40" y="60.5">2</text>
    <circle cx="-40" cy="85" r="8"/><text x="-40" y="88.5">3</text>
    <circle cx="-40" cy="119" r="8"/><text x="-40" y="122.5">4</text>
    <circle cx="-40" cy="141" r="8"/><text x="-40" y="144.5">5</text>
    <circle cx="-40" cy="204" r="8"/><text x="-40" y="207.5">6</text>
    <circle cx="-40" cy="266" r="8"/><text x="-40" y="269.5">7</text>
    <circle cx="-40" cy="322" r="8"/><text x="-40" y="325.5">8</text>
    <circle cx="-40" cy="575" r="8"/><text x="-40" y="578.5">9</text>
  </g>
  <g class="lead">
    <line x1="-32" y1="35" x2="21" y2="35"/><line x1="-32" y1="57" x2="25" y2="57"/><line x1="-32" y1="85" x2="25" y2="85"/><line x1="-32" y1="119" x2="21" y2="119"/><line x1="-32" y1="141" x2="21" y2="141"/><line x1="-32" y1="204" x2="21" y2="204"/><line x1="-32" y1="266" x2="21" y2="266"/><line x1="-32" y1="322" x2="21" y2="322"/><line x1="-32" y1="575" x2="21" y2="575"/>
  </g>

  <line x1="-60" y1="642" x2="250" y2="642" stroke="#1f2430" stroke-width="1.5"/>
  <text x="-60" y="656" class="t-dim">FLOOR · dedicated circuits, count after the server specs</text>
  <line x1="0" y1="668" x2="189" y2="668" class="dl" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="94" y="682" class="t-dim" text-anchor="middle">23.6 in wide · 39.4 in deep · 80.7 in tall</text>
</g>

<!-- ============ KEY ============ -->
<g transform="translate(400 112)">
  <text x="0" y="0" class="t-h">PART · SIZE (in) · NOTES</text>
  <text x="0" y="24" class="t-key"><tspan font-weight="600">1</tspan>  Two Switch SEs on one 1U shelf · U41</text>
  <text x="14" y="38" class="t-sub">9.45 × 4.13 × 1.06 each, 18.9 in side by side. SE #1: the eight camera runs and</text>
  <text x="14" y="50" class="t-sub">the UNVR at 10G, uplink fiber pair B. SE #2: production hosts, the UNAS at 10G, pair C</text>
  <text x="0" y="74" class="t-key"><tspan font-weight="600">2</tspan>  UNVR Pro · U40 to U39</text>
  <text x="14" y="88" class="t-sub">2U, 17.4 × 12.8 × 3.4, 20.8 lb, 7 bays; 10G SFP+ to SE #1</text>
  <text x="0" y="112" class="t-key"><tspan font-weight="600">3</tspan>  UNAS-Pro · U38 to U37</text>
  <text x="14" y="126" class="t-sub">same 2U chassis; 10G SFP+ to SE #2. Protect archive target and the production NAS</text>
  <text x="0" y="150" class="t-key"><tspan font-weight="600">4</tspan>  Plex host, Pi #2, pfSense · U36 to U35</text>
  <text x="14" y="164" class="t-sub">Plex host form factor pending. Pi #2: Pi-hole and NUT for the rack UPS, PoE from</text>
  <text x="14" y="176" class="t-sub">the TPE-1020WS. pfSense: both NICs on SE #2 (DMZ and Mgmt)</text>
  <text x="0" y="200" class="t-key"><tspan font-weight="600">5</tspan>  DLI 222 and TRENDnet TPE-1020WS · U34 to U33</text>
  <text x="14" y="214" class="t-sub">222: production PDU, 8 × C13. TPE-1020WS (owned): 8 × GbE PoE+, 75 W, off SE #2;</text>
  <text x="14" y="226" class="t-sub">Mgmt only: Pi #2, BMCs, JetKVMs, the OOB garage Cat6</text>
  <text x="0" y="250" class="t-key"><tspan font-weight="600">6</tspan>  Lab switches · U30 to U28, all owned</text>
  <text x="14" y="264" class="t-sub">QNAP QSW-M408-4C as the ToR on fiber pair A (4 × 10G combo, 8 × GbE); GP-S100-0800T #1</text>
  <text x="14" y="276" class="t-sub">(8 × 10GBASE-T) for copper-NIC hosts; GP-S100-0800T #2 as the isolated storage network</text>
  <text x="0" y="300" class="t-key"><tspan font-weight="600">7</tspan>  Three Xeon hosts · U27 to U22, drawn at 2U each</text>
  <text x="14" y="314" class="t-sub">Specs pending. The cabinet's rails adjust 25.7 to 34.5 in deep, which is what</text>
  <text x="14" y="326" class="t-sub">rack servers need and the mini racks could not give</text>
  <text x="0" y="350" class="t-key"><tspan font-weight="600">8</tspan>  Gold gen-1 and the second PDU · U21 to U20</text>
  <text x="14" y="364" class="t-sub">Gold gen-1 on a shelf as the nested lab firewall; a second DLI 222 or metered strip</text>
  <text x="14" y="376" class="t-sub">for the lab, so a lab fault cannot trip the production feed</text>
  <text x="0" y="400" class="t-key"><tspan font-weight="600">9</tspan>  Rack UPS · U4 to U1 · 2U to 4U, sized once the servers are known</text>

  <text x="0" y="430" class="t-h">TWO FABRICS, ONE CABINET · PLUS A STORAGE NETWORK</text>
  <text x="0" y="450" class="t-key">Each garage switch has its own fiber pair to Switch X; production (top) and lab</text>
  <text x="0" y="464" class="t-key">(bottom) each have their own PDU. The cameras, the NAS and the Pi never touch</text>
  <text x="0" y="478" class="t-key">the lab switch. The storage switch is a non-routed 10G segment between second</text>
  <text x="0" y="492" class="t-key">NICs in the NAS and the Xeons; NFS and iSCSI only, no gateway, no firewall.</text>

  <text x="0" y="528" class="t-h">DEPTH · 34.5 in max rail depth · 6 px = 1 in</text>
  <g transform="translate(0 538)">
    <line x1="0" y1="0" x2="0" y2="64" stroke="#1f2430" stroke-width="1.5"/>
    <line x1="207" y1="-4" x2="207" y2="68" stroke="#6b7280" stroke-width="0.7" stroke-dasharray="3 2"/>
    <rect x="0" y="4" width="76.8" height="12" class="depth-bar"/><text x="82" y="14" class="t-in">UNVR / UNAS-Pro 12.8</text>
    <rect x="0" y="22" width="168" height="12" class="ghost"/><text x="174" y="32" class="t-in">Xeon host ~28, pending</text>
    <rect x="0" y="40" width="27" height="12" class="depth-bar"/><text x="33" y="50" class="t-in">DLI 222 4.5 · SE 4.13</text>
    <text x="207" y="80" class="t-dim" text-anchor="middle">34.5</text>
  </g>
</g>
</svg>
