  <path d="M-30,-2 L66,-2 L66,10" class="fb" stroke-width="1.6"/>
  <text x="0" y="-16" class="t-in2">OM4 pairs A, B, C from Switch X</text>
  <path d="M230,-36 L120,-36 L120,10" class="cu" stroke-width="3"/>
  <text x="234" y="-33" class="t-in2">8 camera runs, one bundle from the attic</text>

