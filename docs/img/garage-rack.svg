  <g fill="#ffffff" stroke="#3b4252" stroke-width="0.5"><rect x="26" y="256" width="6" height="7"/><rect x="35" y="256" width="6" height="7"/><rect x="44" y="256" width="6" height="7"/><rect x="53" y="256" width="6" height="7"/><rect x="62" y="256" width="6" height="7"/><rect x="71" y="256" width="6" height="7"/><rect x="80" y="256" width="6" height="7"/><rect x="89" y="256" width="6" height="7"/></g>
