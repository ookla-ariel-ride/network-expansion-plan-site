<!-- ============ KEY ============ -->
<g transform="translate(400 112)">
  <text x="0" y="0" class="t-h">PART · SIZE (in) · NOTES</text>
  <text x="0" y="24" class="t-key"><tspan font-weight="600">1</tspan>  Two Switch SEs on one 1U shelf · U41 · 9.45 × 4.13 × 1.06 each</text>
  <text x="14" y="38" class="t-sub">SE #1: the eight camera runs and the UNVR at 10G, fiber pair B. SE #2: production hosts, pair C</text>
  <text x="0" y="60" class="t-key"><tspan font-weight="600">2</tspan>  UNVR Pro · U40 to U39 · 2U, 17.4 × 12.8 × 3.4, 7 bays; 10G SFP+ to SE #1</text>
  <text x="0" y="82" class="t-key"><tspan font-weight="600">3</tspan>  UNAS-Pro · U38 to U37 · Protect archive target; 1G to SE #2</text>
  <text x="0" y="104" class="t-key"><tspan font-weight="600">4</tspan>  UGREEN DXP8800 Plus · U36 to U32, on a shelf · 14.4 × 10.2 × 7.4</text>
  <text x="14" y="118" class="t-sub">8-bay, i5-1235U, 2 × 10GbE: one to SE #2 at 10G (module), one to the storage net</text>
  <text x="0" y="140" class="t-key"><tspan font-weight="600">5</tspan>  UGREEN DXP4800 Plus · U31 to U28, on a shelf</text>
  <text x="14" y="154" class="t-sub">4-bay, 10GbE + 2.5GbE: backup target for the 8800; 2.5G to SE #2, 10G to the storage net</text>
  <text x="0" y="176" class="t-key"><tspan font-weight="600">6</tspan>  Plex host, Pi #2, pfSense · U27 to U26</text>
  <text x="14" y="190" class="t-sub">Plex host form factor pending. Pi #2: Pi-hole, NUT for the rack UPS, PoE from the TPE-1020WS</text>
  <text x="0" y="212" class="t-key"><tspan font-weight="600">7</tspan>  DLI 222 (production PDU) and TRENDnet TPE-1020WS · U25 to U24</text>
  <text x="14" y="226" class="t-sub">TPE-1020WS: 8 × GbE PoE+, 75 W, Mgmt only, off SE #2: Pi #2, BMCs, JetKVMs, OOB Cat6</text>
  <text x="0" y="248" class="t-key"><tspan font-weight="600">8</tspan>  Lab switches · U23 to U21, all owned</text>
  <text x="14" y="262" class="t-sub">QNAP QSW-M408-4C ToR on pair A; GP-2100 #1 for copper-NIC hosts; GP-2100 #2 storage net</text>
  <text x="0" y="284" class="t-key"><tspan font-weight="600">9</tspan>  Three Xeon hosts · U20 to U15, drawn at 2U each · specs pending</text>
  <text x="14" y="298" class="t-sub">The rails adjust 25.7 to 34.5 in deep, which rack servers need and the mini racks could not give</text>
  <text x="0" y="320" class="t-key"><tspan font-weight="600">10</tspan>  QNAP TS-932PX and TS-563 · U14 to U11, on a shelf</text>
  <text x="14" y="334" class="t-sub">Lab NAS on the ToR at 10G, VLAN 99; both still hold Plex data until it is consolidated on the 8800</text>
  <text x="0" y="356" class="t-key"><tspan font-weight="600">11</tspan>  Gold gen-1 (nested lab firewall) and the lab PDU · U10 to U9</text>
  <text x="0" y="378" class="t-key"><tspan font-weight="600">12</tspan>  Rack UPS · U4 to U1 · 2U to 4U, sized once the servers are known</text>

  <text x="0" y="414" class="t-h">TWO FABRICS, ONE CABINET · PLUS A STORAGE NETWORK · 38 OF 42 U USED</text>
  <text x="0" y="434" class="t-key">Each garage switch has its own fiber pair to Switch X; production (top) and lab</text>
  <text x="0" y="448" class="t-key">(bottom) each have their own PDU. The cameras, the NAS and the Pi never touch</text>
  <text x="0" y="462" class="t-key">the lab switch. The storage switch is a non-routed 10G segment between second</text>
  <text x="0" y="476" class="t-key">NICs in the NAS and the Xeons; NFS and iSCSI only, no gateway, no firewall.</text>

  <text x="0" y="512" class="t-h">DEPTH · 34.5 in max rail depth · 6 px = 1 in</text>
  <g transform="translate(0 522)">
    <line x1="0" y1="0" x2="0" y2="64" stroke="#1f2430" stroke-width="1.5"/>
    <line x1="207" y1="-4" x2="207" y2="68" stroke="#6b7280" stroke-width="0.7" stroke-dasharray="3 2"/>
    <rect x="0" y="4" width="76.8" height="12" class="depth-bar"/><text x="82" y="14" class="t-in">UNVR / UNAS-Pro 12.8</text>
    <rect x="0" y="22" width="168" height="12" class="ghost"/><text x="174" y="32" class="t-in">Xeon host ~28, pending</text>
    <rect x="0" y="40" width="27" height="12" class="depth-bar"/><text x="33" y="50" class="t-in">DLI 222 4.5 · SE 4.13</text>
    <text x="207" y="80" class="t-dim" text-anchor="middle">34.5</text>
  </g>
</g>
</svg>
